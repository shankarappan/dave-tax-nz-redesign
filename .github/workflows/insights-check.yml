name: Check owner insights

on:
  pull_request:
    paths:
      - 'insights/**'
      - 'src/articles.js'
      - 'src/wordpressArticles.js'
      - 'src/homeVoiceArticles.js'
      - 'index.html'
      - 'tests/analytics.test.mjs'
      - '.github/workflows/insights-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: insights/package-lock.json
      - run: npm ci
        working-directory: insights
      - run: npm run types && npm run check && npm test && npm run build && npm run deploy:check
        working-directory: insights
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: node --test tests/analytics.test.mjs
